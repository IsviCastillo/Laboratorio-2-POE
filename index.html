<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Libros</title>
  <link rel="stylesheet" href="src/styles/styles.css" />
</head>
<body>
  <header class="encabezado">
    <h1>Catálogo de Libros</h1>
    <p>Administra tu biblioteca personal</p>
  </header>

  <main class="contenedor">
    <div id="mensajes" class="mensajes" role="status" aria-live="polite"></div>

    <section class="panel">
      <h2 id="titulo-form">Registrar libro</h2>
      <form id="form-libro" novalidate>
        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Ej. Cien años de soledad" required />
        </div>
        <div class="campo">
          <label for="autor">Autor</label>
          <input type="text" id="autor" placeholder="Ej. Gabriel García Márquez" required />
        </div>
        <div class="campo">
          <label for="anio">Año</label>
          <input type="number" id="anio" placeholder="Ej. 1967" required />
        </div>
        <div class="botones">
          <button type="submit" id="btn-guardar" class="primario">Agregar libro</button>
          <button type="button" id="btn-cancelar" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Mis libros</h2>
      <div class="herramientas">
        <input type="search" id="buscar" placeholder=" Buscar por título, autor o #ID..." />
        <div class="filtros" role="group" aria-label="Filtrar por estado">
          <button type="button" data-filtro="todos" class="activo">Todos</button>
          <button type="button" data-filtro="pendientes">Pendientes</button>
          <button type="button" data-filtro="leidos">Leídos</button>
        </div>
      </div>
      <p id="contador" class="contador"></p>
      <div id="lista-libros" class="lista"></div>
    </section>
  </main>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
